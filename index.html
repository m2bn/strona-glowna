<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>FICSIT Data Center</title>
    <style>
        body { background: #0b0e14; color: #e6e6e6; font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; overflow: hidden; }
        .card { border-left: 5px solid #f2a900; background: #161b22; padding: 40px; border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); text-align: center; position: relative; }
        h1 { color: #f2a900; margin: 0; font-size: 2.5em; text-transform: uppercase; letter-spacing: 2px; }
        p { color: #8b949e; font-size: 1.1em; margin: 10px 0; }
        .status { display: inline-block; padding: 5px 15px; background: #238636; color: white; border-radius: 20px; font-size: 0.8em; margin-top: 20px; font-weight: bold; }
        .cpu-info { font-family: monospace; color: #58a6ff; margin-top: 15px; font-size: 0.9em; }
    </style>
</head>
<body>
    <div class="card">
        <h1>FICSIT Data Center v1.0</h1>
        <p>Infrastruktura oparta na procesorze Intel Pentium J5005</p>
        <p>Node: <b>pve01-lxc-100</b></p>
        <div class="cpu-info">Core Frequency: 2.80GHz | 8GB RAM LPDDR4</div>
        <div class="status">SYSTEM ONLINE</div>
    </div>
</body>
</html>
